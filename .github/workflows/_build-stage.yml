name: build stage

# Reusable: builds one stage's root formulae, then publishes everything that stage produced.
# Called twice by build-bottles.yml -- once for shared/heavy roots, once for the rest, so the
# second stage pours the first stage's output instead of rebuilding it.

on:
  workflow_call:
    inputs:
      formulae:
        description: JSON array of root formulae to build
        required: true
        type: string
      stage:
        description: Stage name, used in job titles and commit messages
        required: true
        type: string
      allow_failure:
        description: Let a failing formula pass the stage (used for the heavy roots)
        type: boolean
        default: false
      diag:
        description: Space-separated formulae whose build pushes health snapshots to the diag branch
        type: string
        default: ""
    secrets:
      FORK_TOKEN:
        description: PAT with contents:write on the homebrew-core fork
        required: true

env:
  BOTTLE_ROOT_URL: https://github.com/fabiomanz/intel-bottles/releases/download/bottles
  RELEASE_TAG: bottles
  BOTTLES_REPO: fabiomanz/intel-bottles
  FORK_REPO: fabiomanz/homebrew-core
  HOMEBREW_CORE_GIT_REMOTE: https://github.com/fabiomanz/homebrew-core
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_ASK: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # The tap gets uncommitted upstream formula files (release_holds.sh); an auto-update
  # would stash them away mid-job.
  HOMEBREW_NO_AUTO_UPDATE: 1
  # The macOS default, pinned because the compiler-cache steps save and restore
  # $HOMEBREW_CACHE/ccache (see ccache.txt).
  HOMEBREW_CACHE: /Users/runner/Library/Caches/Homebrew
  # 5 made every stalled fetch take longer; the mirrors either answer or they do not.
  HOMEBREW_CURL_RETRIES: 2

jobs:
  build:
    # Each matrix entry carries its own runner, so qtwebengine can go to a self-hosted
    # Intel machine (no 6-hour ceiling) while everything else stays on GitHub's free
    # macos-26-intel. See runners.json.
    name: ${{ inputs.stage }} / ${{ matrix.entry.formula }}
    runs-on: ${{ matrix.entry.labels }}
    timeout-minutes: ${{ matrix.entry.timeout }}
    continue-on-error: ${{ inputs.allow_failure }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        entry: ${{ fromJSON(inputs.formulae) }}
    steps:
      - uses: actions/checkout@v4

      - name: Report disk
        # Kept as one line for diagnostics. There used to be an Xcode-deleting cleanup
        # step here, added on GitHub's documented 14 GB figure; the runner actually has
        # ~160 GB free, so it cost ~5 min a job (3.1 h across a full run) for nothing.
        run: df -h /

      - name: Point Homebrew at the fork
        run: |
          brew tap homebrew/core 2>/dev/null || true
          # Non-fatal. Steps run under `bash -e`, and a non-zero `brew update`
          # killed qttasktree before build_root.sh ever ran -- 46 minutes spent
          # without attempting a single build. A stale tap is far better than a
          # lost job; the plan job already decided what needs building.
          brew update || echo 'WARNING: brew update failed, continuing with the tap as-is'
          echo "core tap: $(brew --repo homebrew/core)"
          git -C "$(brew --repo homebrew/core)" remote -v
          echo "bottle tag: $(brew ruby -e 'puts Utils::Bottles.tag')"

      - name: Build upstream's version of held formulae
        run: ./scripts/release_holds.sh

      - name: Start diagnostics heartbeat
        # Only for formulae named in the `diag` input. A runner that "loses communication"
        # takes its whole log with it; this keeps snapshots on the diag branch instead.
        if: contains(format(' {0} ', inputs.diag), format(' {0} ', matrix.entry.formula))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nohup ./scripts/diag_heartbeat.sh "${{ matrix.entry.formula }}" \
            "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/diag.out" 2>&1 &
          echo "heartbeat started; snapshots go to diag/${GITHUB_RUN_ID}-${{ matrix.entry.formula }}.txt"

      # Formulae in ccache.txt build across several runs: ci-patches/<name>.sed routes
      # their compiler through ccache, the build step stops before the job limit, and the
      # cache is saved either way so the next run only compiles what is still missing.
      - name: Install ccache
        if: matrix.entry.ccache
        run: brew install ccache

      - name: Restore compiler cache
        if: matrix.entry.ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HOMEBREW_CACHE }}/ccache
          key: ccache-${{ matrix.entry.formula }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.entry.formula }}-

      - name: Build and bottle
        # 300 minutes for cached builds, leaving time to save the cache within the job.
        timeout-minutes: ${{ matrix.entry.ccache && 300 || matrix.entry.timeout }}
        env:
          BOTTLE_OUT_DIR: ${{ github.workspace }}/bottles
        # Also written to a file, for the diagnostics heartbeat to tail.
        run: |
          set -o pipefail
          ./scripts/build_root.sh "${{ matrix.entry.formula }}" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Compiler cache statistics
        if: always() && matrix.entry.ccache
        run: CCACHE_DIR="$HOMEBREW_CACHE/ccache" ccache --show-stats || true

      - name: Save compiler cache
        if: always() && matrix.entry.ccache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HOMEBREW_CACHE }}/ccache
          key: ccache-${{ matrix.entry.formula }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Homebrew build logs
        # The step log only shows brew's summary lines; configure and compiler output
        # (why a feature was skipped, which file failed) is only in these.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brewlogs-${{ inputs.stage }}-${{ matrix.entry.formula }}
          path: ~/Library/Logs/Homebrew/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bottles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ inputs.stage }}-${{ matrix.entry.formula }}
          path: bottles/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: publish ${{ inputs.stage }}
    needs: build
    if: always()
    runs-on: macos-26-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # Every stage's artifacts, not just this one's. If an earlier stage's publish
          # never ran (GitHub once failed to acquire a runner for it five times), this
          # one releases its bottles instead. publish.sh drops anything already released.
          pattern: bottles-*
          path: bottles/
          # Unmerged: one directory per job. Merging collapses same-named bottles from
          # jobs that each built a shared dependency, which is how a tarball and a
          # checksum from different builds got published together.
          merge-multiple: false

      - name: Point Homebrew at the fork
        run: |
          brew tap homebrew/core 2>/dev/null || true
          # Non-fatal. Steps run under `bash -e`, and a non-zero `brew update`
          # killed qttasktree before build_root.sh ever ran -- 46 minutes spent
          # without attempting a single build. A stale tap is far better than a
          # lost job; the plan job already decided what needs building.
          brew update || echo 'WARNING: brew update failed, continuing with the tap as-is'

      - name: Authenticate the fork remote
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$(brew --repo homebrew/core)" remote set-url origin \
            "https://x-access-token:${{ secrets.FORK_TOKEN }}@github.com/${FORK_REPO}.git"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOTTLE_DIR: ${{ github.workspace }}/bottles
          STAGE: ${{ inputs.stage }}
        run: ./scripts/publish.sh

      - name: Record manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Records exactly what publish.sh released: its staging directory. This used to
        # glob bottles/*.bottle.json, which matches nothing since artifacts download one
        # directory per job -- so nothing was recorded, the nightly sync wiped every new
        # bottle block, and each run rebuilt the same formulae.
        run: |
          python3 scripts/record_manifest.py bottles/.staged
          git add -A manifest/
          if [ -n "$(git status --porcelain manifest/)" ]; then
            git commit -m "manifest: ${{ inputs.stage }} ($(date -u +%Y-%m-%d))"
            for attempt in 1 2 3; do
              git pull --rebase --autostash && git push && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep 20
            done
          fi
