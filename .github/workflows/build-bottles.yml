name: build bottles

# Builds Intel (x86_64) bottles on GitHub's macos-26-intel runner and publishes them for a
# forked homebrew-core to point at.
#
# Work is scheduled in waves by dependency depth. Ordering matters a lot: when everything
# ran concurrently, six qt* jobs each spent ~70 minutes rebuilding qtbase before starting
# their own build. Publishing each wave before the next starts means later jobs pour their
# dependencies instead.

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated formulae to build instead of the computed plan
        required: false
        type: string
  schedule:
    # Daily, ~74 min after sync-fork, so anything upstream bumped is bottled within a day.
    # The plan job is cheap and schedules nothing when nothing has changed.
    - cron: "37 5 * * *"

concurrency:
  group: build-bottles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: plan
    runs-on: macos-26-intel
    outputs:
      wave0: ${{ steps.plan.outputs.wave0 }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
      wave3: ${{ steps.plan.outputs.wave3 }}
      wave4: ${{ steps.plan.outputs.wave4 }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
    env:
      HOMEBREW_CORE_GIT_REMOTE: https://github.com/fabiomanz/homebrew-core
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Point Homebrew at the fork
        run: |
          brew tap homebrew/core 2>/dev/null || true
          brew update

      - name: Compute the build plan
        id: plan
        env:
          OVERRIDE: ${{ inputs.formulae }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "scripts")
          from plan_targets import runner_for
          names = os.environ["OVERRIDE"].split()
          print(f"wave0={json.dumps([runner_for(n) for n in names])}")
          for i in range(1, 5):
              print(f"wave{i}=[]")
          print(f"missing_count={len(names)}")
          PY
          else
            python3 scripts/plan_targets.py
          fi

  wave0:
    name: wave 0
    needs: plan
    if: needs.plan.outputs.wave0 != '[]' && needs.plan.outputs.wave0 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave0 }}
      stage: wave0
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave1:
    name: wave 1
    needs: [plan, wave0]
    # always(): a failure in an earlier wave must not strand the rest of the graph. A later
    # job will simply rebuild whatever it still needs from source.
    if: always() && needs.plan.outputs.wave1 != '[]' && needs.plan.outputs.wave1 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave1 }}
      stage: wave1
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave2:
    name: wave 2
    needs: [plan, wave1]
    if: always() && needs.plan.outputs.wave2 != '[]' && needs.plan.outputs.wave2 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave2 }}
      stage: wave2
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave3:
    name: wave 3
    needs: [plan, wave2]
    if: always() && needs.plan.outputs.wave3 != '[]' && needs.plan.outputs.wave3 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave3 }}
      stage: wave3
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave4:
    name: wave 4
    needs: [plan, wave3]
    if: always() && needs.plan.outputs.wave4 != '[]' && needs.plan.outputs.wave4 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave4 }}
      stage: wave4
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
