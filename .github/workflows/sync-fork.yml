name: sync fork

# Keeps fabiomanz/homebrew-core equal to upstream plus our bottle blocks.
# Runs daily so new formula versions arrive; anything whose version moved loses its stale
# bottle here and gets picked up by the build run that starts when this one completes.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: sync-fork
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: macos-26-intel
    # Normally under 10 minutes; a hung step should hand over to sync-retry quickly.
    timeout-minutes: 30
    # GitHub sometimes loses the hosted runner ("lost communication", no log). On
    # 2026-10-29 that hit the Sync step, and nothing synced until it was re-run by hand
    # hours later. A failure here is therefore not final: sync-retry runs the same steps
    # on a fresh runner. sync_fork.sh rebuilds the fork from upstream every time and
    # pushes once at the end, so a second run is safe.
    continue-on-error: true
    outputs:
      done: ${{ steps.done.outputs.done }}
    env: &sync-env
      FORK_REPO: fabiomanz/homebrew-core
      HOMEBREW_CORE_GIT_REMOTE: https://github.com/fabiomanz/homebrew-core
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ASK: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps: &sync-steps
      - uses: actions/checkout@v4

      - name: Point Homebrew at the fork
        run: |
          brew tap homebrew/core 2>/dev/null || true
          # Non-fatal. Steps run under `bash -e`, and a non-zero `brew update`
          # killed qttasktree before build_root.sh ever ran -- 46 minutes spent
          # without attempting a single build. A stale tap is far better than a
          # lost job; the plan job already decided what needs building.
          brew update || echo 'WARNING: brew update failed, continuing with the tap as-is'

      - name: Authenticate the fork remote
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$(brew --repo homebrew/core)" remote set-url origin \
            "https://x-access-token:${{ secrets.FORK_TOKEN }}@github.com/${FORK_REPO}.git"

      - name: Sync
        run: ./scripts/sync_fork.sh

      - name: Mark as done
        # sync-retry reads this. A job that lost its runner never gets here, whatever
        # GitHub then reports as its result.
        id: done
        run: echo "done=true" >> "$GITHUB_OUTPUT"

  sync-retry:
    needs: sync
    if: ${{ !cancelled() && needs.sync.outputs.done != 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 30
    env: *sync-env
    steps: *sync-steps
